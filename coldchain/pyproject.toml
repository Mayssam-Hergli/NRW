[project]
name = "coldchain"
version = "0.1.0"
description = "Cold chain integrity system for pharmaceutical road distribution."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "cbor2>=5.5",
    "paho-mqtt>=2.0",
    "supabase>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*", "models*", "reports*", "shared*", "simulator*"]
exclude = ["dashboard*", "firmware*", "infra*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "supabase_live: requires a real Supabase project (SUPABASE_URL etc.); skipped when absent",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
